<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Uber - Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenido</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-input label="Correo o teléfono" labelPlacement="floating" type="text" [(ngModel)]="login"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="password" (keyup.enter)="onLogin()"></ion-input>
      </ion-item>

      @if (error) {
        <ion-text color="danger"><p>{{ error }}</p></ion-text>
      }

      <ion-button expand="block" class="ion-margin-top" (click)="onLogin()" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </ion-button>

      <ion-button expand="block" fill="clear" routerLink="/register">
        ¿No tienes cuenta? Regístrate
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
