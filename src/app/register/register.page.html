<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Registro</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-select label="Soy" labelPlacement="floating" [(ngModel)]="form.role">
          <ion-select-option value="client">Cliente</ion-select-option>
          <ion-select-option value="driver">Conductor</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-input label="Nombre" labelPlacement="floating" [(ngModel)]="form.name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Correo" labelPlacement="floating" type="email" [(ngModel)]="form.email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Teléfono" labelPlacement="floating" type="tel" [(ngModel)]="form.phone"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="form.password"></ion-input>
      </ion-item>

      @if (form.role === 'driver') {
        <ion-item>
          <ion-input label="Número de licencia" labelPlacement="floating" [(ngModel)]="form.license_number"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Placa" labelPlacement="floating" [(ngModel)]="form.plate"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Marca" labelPlacement="floating" [(ngModel)]="form.brand"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Modelo" labelPlacement="floating" [(ngModel)]="form.model"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Año" labelPlacement="floating" type="number" [(ngModel)]="form.year"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Capacidad" labelPlacement="floating" type="number" [(ngModel)]="form.capacity"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Color" labelPlacement="floating" [(ngModel)]="form.color"></ion-input>
        </ion-item>
      }

      @if (error) {
        <ion-text color="danger"><p>{{ error }}</p></ion-text>
      }

      <ion-button expand="block" class="ion-margin-top" (click)="onRegister()" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrarme' }}
      </ion-button>

      <ion-button expand="block" fill="clear" routerLink="/login">
        ¿Ya tienes cuenta? Inicia sesión
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
