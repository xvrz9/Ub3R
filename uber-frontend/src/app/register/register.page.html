<ion-content class="u-auth">
  <div class="u-auth__banda">
    <div class="u-auth__banda-in">
      <span class="u-brand"><span class="u-brand__logo">U</span>Ub3R</span>
      <h1 class="u-auth__titulo">Crea tu cuenta.</h1>
      <p class="u-auth__lema">Elige si vas a viajar o a conducir.</p>
    </div>
  </div>

  <form class="u-auth__tarjeta u-auth__tarjeta--ancha u-entra" (ngSubmit)="onRegister()">
    <div class="u-roles">
      <button type="button" class="u-rol" [class.u-rol--activo]="form.role === 'client'" (click)="elegirRol('client')">
        <span class="u-rol__icono">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="7.5" r="3.5" />
            <path d="M5 20.5a7 7 0 0 1 14 0" />
          </svg>
        </span>
        <strong>Pasajero</strong>
        <small>Pide viajes por la ciudad</small>
      </button>
      <button type="button" class="u-rol" [class.u-rol--activo]="form.role === 'driver'" (click)="elegirRol('driver')">
        <span class="u-rol__icono">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 17h14M6.5 17v2M17.5 17v2M4 17v-4l2-5.5A2 2 0 0 1 7.9 6h8.2a2 2 0 0 1 1.9 1.5L20 13v4M4 13h16" />
            <circle cx="7.5" cy="14.8" r=".6" fill="currentColor" />
            <circle cx="16.5" cy="14.8" r=".6" fill="currentColor" />
          </svg>
        </span>
        <strong>Conductor</strong>
        <small>Acepta viajes con tu vehículo</small>
      </button>
    </div>

    <div class="u-campo">
      <label for="name">Nombre completo</label>
      <input id="name" class="u-input" name="name" autocomplete="name" placeholder="Ana Gómez" [(ngModel)]="form.name" />
    </div>

    <div class="u-grid-2">
      <div class="u-campo">
        <label for="email">Correo</label>
        <input id="email" class="u-input" name="email" type="email" autocomplete="email"
               placeholder="ana@correo.com" [(ngModel)]="form.email" />
      </div>
      <div class="u-campo">
        <label for="phone">Teléfono <span class="u-opcional">(opcional)</span></label>
        <input id="phone" class="u-input" name="phone" type="tel" autocomplete="tel"
               placeholder="3001234567" [(ngModel)]="form.phone" />
      </div>
    </div>

    <div class="u-grid-2">
      <div class="u-campo">
        <label for="password">Contraseña</label>
        <div class="u-clave">
          <input id="password" class="u-input" name="password" [type]="verClave ? 'text' : 'password'"
                 autocomplete="new-password" placeholder="Mínimo 6 caracteres" [(ngModel)]="form.password" />
          <button type="button" class="u-btn u-btn--link u-btn--sm u-clave__ver"
                  [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Ver contraseña'" (click)="verClave = !verClave">
            {{ verClave ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
      </div>
      <div class="u-campo">
        <label for="confirmacion">Repite la contraseña</label>
        <input id="confirmacion" class="u-input" name="confirmacion" [type]="verClave ? 'text' : 'password'"
               autocomplete="new-password" placeholder="Igual a la anterior" [(ngModel)]="confirmacion" />
      </div>
    </div>

    @if (form.role === 'driver') {
      <div class="u-entra">
        <p class="u-subtitulo">Licencia y vehículo</p>

        <div class="u-campo">
          <label for="license">Número de licencia</label>
          <input id="license" class="u-input" name="license_number" placeholder="LIC-123456" [(ngModel)]="form.license_number" />
        </div>

        <div class="u-grid-2">
          <div class="u-campo">
            <label for="plate">Placa</label>
            <input id="plate" class="u-input u-mayusculas" name="plate" placeholder="ABC123"
                   [(ngModel)]="form.plate" />
          </div>
          <div class="u-campo">
            <label for="year">Año</label>
            <input id="year" class="u-input" name="year" type="number" inputmode="numeric"
                   [placeholder]="anioActual" [(ngModel)]="form.year" />
          </div>
          <div class="u-campo">
            <label for="brand">Marca</label>
            <input id="brand" class="u-input" name="brand" placeholder="Chevrolet" [(ngModel)]="form.brand" />
          </div>
          <div class="u-campo">
            <label for="model">Modelo</label>
            <input id="model" class="u-input" name="model" placeholder="Spark GT" [(ngModel)]="form.model" />
          </div>
          <div class="u-campo">
            <label for="capacity">Pasajeros</label>
            <select id="capacity" class="u-select" name="capacity" [(ngModel)]="form.capacity">
              @for (n of [1, 2, 3, 4, 5, 6]; track n) {
                <option [ngValue]="n">{{ n }}</option>
              }
            </select>
          </div>
          <div class="u-campo">
            <label for="color">Color <span class="u-opcional">(opcional)</span></label>
            <input id="color" class="u-input" name="color" placeholder="Blanco" [(ngModel)]="form.color" />
          </div>
        </div>

        <div class="u-aviso u-aviso--info">
          Tu cuenta de conductor queda pendiente hasta que un administrador la apruebe. Luego podrás conectarte.
        </div>
      </div>
    }

    @if (error()) {
      <div class="u-aviso u-aviso--error u-entra u-mt">{{ error() }}</div>
    }

    <button type="submit" class="u-btn u-mt" [disabled]="loading()">
      @if (loading()) { <span class="u-spin"></span> Creando cuenta... }
      @else { {{ form.role === 'driver' ? 'Registrarme como conductor' : 'Registrarme como pasajero' }} }
    </button>

    <p class="u-auth__pie">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </form>
</ion-content>
